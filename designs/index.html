*{box-sizing:border-box}body{margin:0;background:#f0f1f3;font-family:Inter,'Segoe UI',Arial,sans-serif;color:#222b33}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #657dcd;outline-offset:4px}.review-bar{height:82px;background:#fff;border-bottom:1px solid #dde1e6;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;z-index:2}.review-brand{min-width:130px}.review-brand b{font-size:15px;letter-spacing:-.4px}.review-brand small{display:block;font-size:10px;color:#9297a0;margin-top:5px}.variants{display:flex;gap:5px;align-items:center}.variant{border:1px solid transparent;background:transparent;padding:10px 13px;border-radius:7px;color:#8a919b;font-size:11px;display:flex;align-items:center;gap:8px;white-space:nowrap}.variant .num{font-size:10px;display:grid;place-items:center;background:#eff1f3;color:#8a919b;border-radius:4px;height:20px;width:20px}.variant[aria-pressed=true]{background:#f5f7fa;border-color:#dce1e9;color:#273647}.variant[aria-pressed=true] .num{background:#293849;color:#fff}.review-tools{display:flex;gap:6px;align-items:center}.mode{background:none;border:1px solid transparent;border-radius:6px;color:#a0a6af;width:32px;height:32px;padding:7px;display:flex;justify-content:center;align-items:center}.mode.active{color:#3e4b5d;border-color:#e4e7eb;background:#f7f8fa}.open-full{font-size:10px;text-decoration:none;color:#7b8491;padding:8px 0 8px 10px;white-space:nowrap}.stage{height:calc(100dvh - 122px);display:flex;justify-content:center;overflow:hidden}.stage iframe{border:0;display:block;width:100%;height:100%;background:white;transition:width .2s}.stage.mobile{padding:18px}.stage.mobile iframe{width:390px;max-width:100%;border-radius:17px;box-shadow:0 15px 50px #26304220;border:6px solid #323b47}.review-footer{height:40px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 24px;background:#fff;border-top:1px solid #e1e5ea;font-size:10px;color:#929aa4}.description{display:flex;align-items:center;gap:10px}.description b{font-weight:500;color:#5f6c7c}.review-footer span:last-child{white-space:nowrap}.dot{display:inline-block;width:5px;height:5px;background:#adb6c2;border-radius:50%;margin-right:5px}@media(max-width:1120px){.review-brand{min-width:100px}.review-brand b{font-size:13px}.review-bar{padding:0 15px;gap:10px}.variant{padding:8px;font-size:10px}.open-full{font-size:0}.open-full span{font-size:17px}.review-tools{gap:2px}}@media(max-width:760px){.review-bar{height:107px;display:grid;grid-template-columns:1fr auto;gap:4px;padding:11px 13px 8px}.review-brand{display:flex;align-items:center;gap:10px}.review-brand small{margin:0;font-size:9px}.review-brand b{font-size:12px}.review-tools{grid-column:2;grid-row:1}.variants{grid-column:1 / -1;grid-row:2;gap:3px;justify-content:space-between}.variant{padding:6px 5px;gap:4px;font-size:9px;border-radius:5px}.variant .num{height:17px;width:17px;font-size:9px}.mode{display:none}.open-full{padding:3px}.stage{height:calc(100dvh - 149px)}.review-footer{height:42px;padding:5px 13px;font-size:9px}.review-footer>span:last-child{display:none}.description{gap:4px;display:block;line-height:1.6}.description b{margin-right:7px}.stage.mobile{padding:0}.stage.mobile iframe{border:0;border-radius:0;width:100%}}
</style></head><body><header class="review-bar"><div class="review-brand"><b>рули / концепции</b><small>Выбираем направление</small></div><nav class="variants" aria-label="Варианты дизайна"><button class="variant" data-v="1" aria-pressed="true"><span class="num">01</span>Светлый фокус</button><button class="variant" data-v="2" aria-pressed="false"><span class="num">02</span>Тёмный пульт</button><button class="variant" data-v="3" aria-pressed="false"><span class="num">03</span>План дня</button><button class="variant" data-v="4" aria-pressed="false"><span class="num">04</span>Карта команды</button></nav><div class="review-tools"><button class="mode active" data-mode="desktop" title="Компьютер" aria-label="Вид на компьютере" aria-pressed="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button><button class="mode" data-mode="mobile" title="Телефон" aria-label="Вид на телефоне" aria-pressed="false"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/></svg></button><a class="open-full" href="v1.html" target="_blank" rel="noopener">Во весь экран <span>↗</span></a></div></header><main class="stage"><iframe src="v1.html" title="Вариант 1 — Светлый фокус"></iframe></main><footer class="review-footer"><div class="description"><b id="variant-title">01 / Светлый фокус</b><span id="variant-description">Общий список задач. Решения и сроки на первом плане.</span></div><span><i class="dot"></i>Макеты для согласования · демо-данные</span></footer><script>
const variants={1:['Светлый фокус','Общий список задач. Решения и сроки на первом плане.'],2:['Тёмный пульт','Канбан: от очереди до принятого результата.'],3:['План дня','Три приоритета и спокойная типографика.'],4:['Карта команды','Обзор по исполнителям: люди, AI и их загрузка.']};
const frame=document.querySelector('iframe');function selectVariant(n){if(!variants[n])n=1;document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.v)===Number(n))));frame.src=`v${n}.html`;frame.title=`Вариант ${n} — ${variants[n][0]}`;document.querySelector('.open-full').href=`v${n}.html`;document.getElementById('variant-title').textContent=`0${n} / ${variants[n][0]}`;document.getElementById('variant-description').textContent=variants[n][1];const url=new URL(location.href);url.searchParams.set('v',n);history.replaceState(null,'',url);}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>selectVariant(Number(b.dataset.v)));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelector('.stage').classList.toggle('mobile',b.dataset.mode==='mobile');document.querySelectorAll('[data-mode]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});});selectVariant(Number(new URL(location.href).searchParams.get('v'))||1);
</script></body></html>
